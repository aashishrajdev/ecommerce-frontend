<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shopping Cart - E-Commerce</title>
    <link rel="stylesheet" href="styles/main.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />
  </head>
  <body>
    <header class="main-header">
      <div class="header-container">
        <!-- Logo -->
        <div class="logo">
          <a href="/">
            <img src="assets/logo.svg" alt="E-Commerce Logo" class="logo-img" />
          </a>
        </div>

        <!-- Navigation -->
        <nav class="main-nav">
          <ul class="nav-list">
            <li><a href="/" class="nav-link">Home</a></li>
            <li><a href="/products" class="nav-link">Products</a></li>
            <li><a href="/about" class="nav-link">About</a></li>
            <li><a href="/contact" class="nav-link">Contact</a></li>
          </ul>
        </nav>

        <!-- Search and Cart -->
        <div class="header-right">
          <div class="search-container">
            <input
              type="text"
              class="search-input"
              placeholder="Search products..."
            />
            <button class="search-button" aria-label="Search">
              <i class="fas fa-search"></i>
            </button>
          </div>
          <div class="cart-container">
            <a href="/cart" class="cart-link">
              <i class="fas fa-shopping-cart"></i>
              <span class="cart-count">0</span>
            </a>
          </div>
          <button class="hamburger-menu" aria-label="Toggle navigation menu">
            <i class="fas fa-bars"></i>
          </button>
        </div>
      </div>
    </header>

    <main class="cart-page">
      <div class="container">
        <div class="cart-header">
          <h1>Shopping Cart</h1>
          <a href="/products" class="continue-shopping">
            <i class="fas fa-arrow-left"></i>
            Continue Shopping
          </a>
        </div>

        <div class="cart-content">
          <!-- Cart Items -->
          <div class="cart-items" id="cartItems">
            <!-- Cart items will be dynamically added here -->
          </div>

          <!-- Cart Summary -->
          <div class="cart-summary">
            <h2>Order Summary</h2>
            <div class="summary-details">
              <div class="summary-row">
                <span>Subtotal</span>
                <span class="subtotal">$0.00</span>
              </div>
              <div class="summary-row">
                <span>Shipping</span>
                <span class="shipping">$0.00</span>
              </div>
              <div class="summary-row">
                <span>Tax</span>
                <span class="tax">$0.00</span>
              </div>
              <div class="summary-row total">
                <span>Total</span>
                <span class="total-price">$0.00</span>
              </div>
            </div>
            <button class="checkout-btn" disabled>Proceed to Checkout</button>
          </div>
        </div>

        <!-- Empty Cart Message -->
        <div class="empty-cart" id="emptyCart">
          <i class="fas fa-shopping-cart"></i>
          <h2>Your cart is empty</h2>
          <p>Looks like you haven't added any items to your cart yet.</p>
          <a href="/products" class="btn-primary">Start Shopping</a>
        </div>
      </div>
    </main>

    <script src="scripts/cart.js"></script>
    <script src="scripts/cart-page.js"></script>
  </body>
</html>
