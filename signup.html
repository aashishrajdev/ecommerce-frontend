<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign Up - E-Commerce</title>
    <link rel="stylesheet" href="styles/main.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />
  </head>
  <body>
    <header class="main-header">
      <div class="header-container">
        <!-- Logo -->
        <div class="logo">
          <a href="/">
            <img src="assets/logo.svg" alt="E-Commerce Logo" class="logo-img" />
          </a>
        </div>

        <!-- Navigation -->
        <nav class="main-nav">
          <ul class="nav-list">
            <li><a href="/" class="nav-link">Home</a></li>
            <li><a href="/products" class="nav-link">Products</a></li>
            <li><a href="/about" class="nav-link">About</a></li>
            <li><a href="/contact" class="nav-link">Contact</a></li>
          </ul>
        </nav>

        <!-- Search and Cart -->
        <div class="header-right">
          <div class="search-container">
            <input
              type="text"
              class="search-input"
              placeholder="Search products..."
            />
            <button class="search-button" aria-label="Search">
              <i class="fas fa-search"></i>
            </button>
          </div>
          <div class="cart-container">
            <a href="/cart" class="cart-link">
              <i class="fas fa-shopping-cart"></i>
              <span class="cart-count">0</span>
            </a>
          </div>
          <button class="hamburger-menu" aria-label="Toggle navigation menu">
            <i class="fas fa-bars"></i>
          </button>
        </div>
      </div>
    </header>

    <main class="auth-page">
      <div class="container">
        <div class="auth-container">
          <div class="auth-header">
            <h1>Create Account</h1>
            <p>Please fill in the details to create your account</p>
          </div>

          <form id="signupForm" class="auth-form">
            <div class="form-group">
              <label for="fullName">Full Name</label>
              <div class="input-group">
                <i class="fas fa-user"></i>
                <input
                  type="text"
                  id="fullName"
                  name="fullName"
                  placeholder="Enter your full name"
                  required
                />
              </div>
              <div class="error-message" id="fullNameError"></div>
            </div>

            <div class="form-group">
              <label for="email">Email</label>
              <div class="input-group">
                <i class="fas fa-envelope"></i>
                <input
                  type="email"
                  id="email"
                  name="email"
                  placeholder="Enter your email"
                  required
                />
              </div>
              <div class="error-message" id="emailError"></div>
            </div>

            <div class="form-group">
              <label for="password">Password</label>
              <div class="input-group">
                <i class="fas fa-lock"></i>
                <input
                  type="password"
                  id="password"
                  name="password"
                  placeholder="Create a password"
                  required
                />
                <button
                  type="button"
                  class="toggle-password"
                  aria-label="Toggle password visibility"
                >
                  <i class="fas fa-eye"></i>
                </button>
              </div>
              <div class="password-strength">
                <div class="strength-bar"></div>
                <span class="strength-text">Password strength</span>
              </div>
              <div class="error-message" id="passwordError"></div>
            </div>

            <div class="form-group">
              <label for="confirmPassword">Confirm Password</label>
              <div class="input-group">
                <i class="fas fa-lock"></i>
                <input
                  type="password"
                  id="confirmPassword"
                  name="confirmPassword"
                  placeholder="Confirm your password"
                  required
                />
                <button
                  type="button"
                  class="toggle-password"
                  aria-label="Toggle password visibility"
                >
                  <i class="fas fa-eye"></i>
                </button>
              </div>
              <div class="error-message" id="confirmPasswordError"></div>
            </div>

            <div class="form-options">
              <div class="terms-agreement">
                <input type="checkbox" id="terms" name="terms" required />
                <label for="terms">
                  I agree to the
                  <a href="/terms" class="terms-link">Terms of Service</a>
                  and
                  <a href="/privacy" class="terms-link">Privacy Policy</a>
                </label>
              </div>
            </div>

            <button type="submit" class="btn-primary">Sign Up</button>

            <div class="auth-footer">
              <p>
                Already have an account?
                <a href="/login" class="switch-form">Login</a>
              </p>
            </div>
          </form>
        </div>
      </div>
    </main>

    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-auth-compat.js"></script>
    <script src="scripts/auth.js"></script>
  </body>
</html>
